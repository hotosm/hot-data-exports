[project]
name = "hot-data-exports"
version = "0.0.1"
description = "HOT's OpenStreetMap exports for countries, disaster events and Tasking Manager projects."
requires-python = ">=3.13"
dependencies = [
    "botocore>=1.43.9",
    "hdx-python-api>=6.6.7",
    "oex>=0.4.36",
    "omegaconf>=2.3.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.2",
    "quackosm",
    "universal-pathlib>=0.3.10",
]

[dependency-groups]
dev = [
    "commitizen>=4.20.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.13",
    "ty>=0.0.78",
]
docs = ["zensical>=0.0.71"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[tool.ty.environment]
# The scripts import one another by module name, as pytest's pythonpath does for the tests.
extra-paths = ["scripts"]

[tool.commitizen]
name = "cz_conventional_commits"

[tool.uv]
package = false

[tool.uv.sources]
quackosm = { git = "https://github.com/kshitijrajsharma/quackosm", rev = "edb08ddfd98defda5fae51976fb317cc7deef6df" }
