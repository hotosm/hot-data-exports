categories_file: configs/_hot-schema.yaml

key: hotosm
subnational: true
frequency: monthly

boundary:
  source: fieldmaps
  buffer_meters: 2000
  simplify_meters: 500

output:
  dir: ${oc.env:OEX_DATA_DIR,.}/output
  formats: [gpkg, shp, geoparquet]
  metadata: true
  skip_unchanged: true
  report:
    enabled: true
    related_datasets: true
    theme:
      accent_color: "#cc2936"
      map_popup_color: "#cc2936"
  pmtiles:
    enabled: true
  stac:
    catalog: true
    id: hotosm-country-exports
    title: HOT OpenStreetMap country exports
    description: OpenStreetMap layers per country, published to HDX by HOT.
  s3:
    enabled: true
    bucket: ${oc.env:OEX_S3_BUCKET}
    prefix: ISO3
    region: ${oc.env:OEX_S3_REGION,us-east-1}
    acl: ${oc.env:OEX_S3_ACL,public-read}

hdx:
  push: true
  site: prod
  api_key: ${oc.env:HDX_API_KEY}
  owner_org: ${oc.env:HDX_OWNER_ORG}
  maintainer: ${oc.env:HDX_MAINTAINER}
  user_agent: osm-country-exports/0.1
  purge_existing_resources: false

source:
  overture:
    enabled: false

  osm:
    cache_dir: ${oc.env:OEX_DATA_DIR,.}/data/osm
    planet_fallback: true
    pbf_path: ${oc.env:OEX_DATA_DIR,.}/data/osm/planet/planet-latest.osm.pbf
    auto_download_planet: true
  pcodes:
    enabled: true
    cache_dir: ${oc.env:OEX_DATA_DIR,.}/data/pcodes
    # geos runs outside DuckDB's memory budget, so large countries can exhaust memory.
    boundary_resolution: h3_neighbor
