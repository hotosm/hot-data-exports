# Merged under every file in configs/events/; a value set in the event file wins.

key: hotosm_event
output:
  stac:
    catalog: true
    id: hotosm-country-exports
    title: HOT OpenStreetMap country exports
    description: OpenStreetMap layers per country, published to HDX by HOT.
    group: activations
    group_title: Activations
  dir: ${oc.env:OEX_DATA_DIR,.}/output
  formats: [gpkg, kml, shp]
  # oex always zips shp; GeoJSON from a category stays unzipped so it can be fetched from its URL.
  zip_formats: [gpkg, kml]
  metadata: true
  report:
    enabled: true
  # Past the z12 default so buildings stay legible at damage-assessment zooms.
  pmtiles:
    enabled: true
    max_zoom: 15
  s3:
    enabled: true
    bucket: ${oc.env:OEX_S3_BUCKET,""}
    prefix: ISO3
    region: ${oc.env:OEX_S3_REGION,us-east-1}
    acl: ${oc.env:OEX_S3_ACL,public-read}

source:
  osm:
    engine: postpass
    fallback_engine: rawdata
    cache_dir: ${oc.env:OEX_DATA_DIR,.}/data/osm
  pcodes:
    enabled: true
    cache_dir: ${oc.env:OEX_DATA_DIR,.}/data/pcodes

hdx:
  push: true
  site: prod
  combine: true
  owner_org: ${oc.env:HDX_OWNER_ORG,null}
  maintainer: ${oc.env:HDX_MAINTAINER,null}
  user_agent: osm-country-exports/0.1
  methodology_other: Crowdsourced disaster mapping
  # The Overture run must keep what the OSM run put on the combined dataset.
  purge_existing_resources: false
