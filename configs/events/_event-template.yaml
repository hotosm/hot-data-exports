# Copy to configs/events/<ISO3>-<hazard>-<year>-<name>.yaml; see docs/maintain/add-an-event.md.

frequency: daily
expires: 2026-12-31

boundary:
  geom: 'CHANGE_ME'

hdx:
  time_period_start: "2026-01-01"
  combined:
    title: CHANGE_ME
    source: OpenStreetMap contributors
    tags: [flooding, affected area, geodata]
    notes: |
      What the dataset covers, which area, and why it was made.
    caveats: |
      What it leaves out.

categories_file: configs/_hot-schema.yaml
