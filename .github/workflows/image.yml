name: Image

on:
  pull_request:
    paths: &paths
      - "configs/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/image.yml"
  push:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: default
            prefix: ""
            base: ""
            check: true
          - variant: windmill
            prefix: windmill-
            base: BASE=ghcr.io/windmill-labs/windmill:1.780.0
            check: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,prefix=${{ matrix.prefix }}
            type=sha,format=short,prefix=${{ matrix.prefix }}sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.variant == 'windmill' && 'exports' || '' }}
          build-args: ${{ matrix.base }}
          load: ${{ github.event_name == 'pull_request' && matrix.check }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
      - if: github.event_name == 'pull_request' && matrix.check
        run: docker run --rm "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" --check
